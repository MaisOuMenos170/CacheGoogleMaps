name: Comentário do catálogo

on:
  pull_request:
    paths:
      - data/lugares.json
      - data/roteiros-esperados.json
      - scripts/catalog/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comment:
    name: Conferir lugares.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Conferir
        id: check
        continue-on-error: true
        run: node scripts/catalog/check-lugares.mjs --out catalog-report.md

      - name: Publicar o resumo
        if: always()
        run: cat catalog-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar no pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file catalog-report.md

      - name: Falhar quando o seed quebraria
        if: steps.check.outcome == 'failure'
        run: exit 1
